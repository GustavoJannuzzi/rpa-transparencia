[project]
name = "rpa-transparencia"
version = "0.1.0"
description = "Robôs que reúnem dados públicos de parlamentares de sistemas diferentes num modelo único, com conferência e procedência."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["coleta/testes"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not contrato' -q"
markers = [
    "contrato: roda contra o portal de verdade e avisa quando o layout mudou (python -m pytest -m contrato)",
]
