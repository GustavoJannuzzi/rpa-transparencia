# Quem o robô coleta. Um adaptador por fornecedor; cada adaptador recebe daqui a
# lista de entidades (casas) que atende, com endereço, código da entidade e consulta.
#
# Casa nova num fornecedor que já tem adaptador = um bloco novo aqui, nenhuma linha
# de código. O `descobrir` confere cada bloco contra a própria fonte (o CNPJ da
# entidade na API de entidades do Elotech, por exemplo) e para se não bater.
#
# Período comum das casas novas: o mesmo da 57ª legislatura federal.
[periodo]
de = 2023
ate = 2026

# ---------------------------------------------------------------------------
# Elotech (Oxy / eloweb): API pública do portal, cabeçalhos `entidade` e
# `exercicio`. `host` é a instalação; `entidade`, o número da Câmara nela (a
# Prefeitura costuma ser 1). Escolha: cidades grandes e uma por região, da lista
# inicial do levantamento de 26/11/2026.
# ---------------------------------------------------------------------------

# Curitiba usa o Elotech de 2017 a 2023, e o mesmo adaptador a atende com as
# particularidades daquela série (diária só com matrícula até 2020).
[[elotech]]
fonte = "cmc_elotech"
casa = "cmc"
municipio = "Curitiba"
ibge = 4106902
regiao = "Metropolitana de Curitiba"
host = "https://cmcuritiba.eloweb.net"
entidade = 1
cnpj = "77636520000110"
de = 2017
ate = 2023
tela = "https://cmcuritiba.eloweb.net/portaltransparencia/1"

