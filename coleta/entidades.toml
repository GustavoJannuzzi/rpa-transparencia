# ---------------------------------------------------------------------------
# Betha Cloud: robô de navegador. `portal` é o código do portal na URL
# (transparencia.betha.cloud/#/<portal>), conferido no `descobrir` contra o
# código IBGE que o próprio portal informa. A consulta de diárias não está
# aqui: cada câmara monta o próprio menu, e o robô acha a consulta pelo texto
# do item ("Diárias", "Diárias.", "Diárias 2026"). Levantamento de 26/11/2026:
# 58 câmaras do PR no Betha; estas são a lista inicial (cidades grandes e uma
# por região). `fora` = está no Betha, mas não dá para coletar; o motivo vai
# para a página Cobertura.
# ---------------------------------------------------------------------------

