# Quem o robô coleta. Um adaptador por fornecedor; cada adaptador recebe daqui a
# lista de entidades (casas) que atende, com endereço, código da entidade e consulta.
#
# Casa nova num fornecedor que já tem adaptador = um bloco novo aqui, nenhuma linha
# de código. O `descobrir` confere cada bloco contra a própria fonte (o CNPJ da
# entidade na API de entidades do Elotech, por exemplo) e para se não bater.
#
# Período comum das casas novas: o mesmo da 57ª legislatura federal.
[periodo]
de = 2023
ate = 2026

# ---------------------------------------------------------------------------
